name: Community staging image (manual release)

# A pull request tests the Dockerfile without publishing or deploying.
# A maintainer can explicitly dispatch from main to create a prebuilt image release.
on:
  pull_request:
    paths:
      - .github/workflows/community-staging-image.yml
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-staging-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build Community image without publishing
        run: |
          set -euo pipefail
          docker build --tag h00k-community:ci .
      - name: Check runtime is complete
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh h00k-community:ci -ec '
            test -f /app/communityServer.ts
            test -f /app/dist-profile/community.html
            test -f /app/dist-profile/profile.html
            test -f /app/server/community/schema.sql
            test -d /app/node_modules/tsx
            test ! -e /app/.env.community
          '

  publish-staging-image:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'maks37614/h00k-community'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Recheck source before packaging
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build
          test ! -e .env.community
          test ! -e .env

      - name: Build reproducibly labelled amd64 image
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          IMAGE="h00k-community:${SHA}"
          echo "RELEASE_SHA=${SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}" .
          docker run --rm --entrypoint sh "${IMAGE}" -ec '
            test -f /app/communityServer.ts
            test -f /app/dist-profile/community.html
            test -f /app/dist-profile/profile.html
            test -f /app/server/community/schema.sql
            test -d /app/node_modules/tsx
            test ! -e /app/.env.community
          '

      - name: Export image and SHA256 checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/community-release"
          cd "$RUNNER_TEMP/community-release"
          docker save "$RELEASE_IMAGE" | gzip -1 > h00k-community-image.tar.gz
          sha256sum h00k-community-image.tar.gz > h00k-community-image.tar.gz.sha256
          sha256sum -c h00k-community-image.tar.gz.sha256
          cat > release-notes.md <<EOF
          Manual staging candidate from verified commit \`${GITHUB_SHA}\`.

          Docker image tag: \`${RELEASE_IMAGE}\` (linux/amd64).

          This is a prebuilt artifact only. Nothing has been deployed to the VPS.
          Before installing: run read-only preflight, back up PostgreSQL and
          \`.env.community\`, keep the previous image, verify the SHA256
          and recreate only the Community service with \`--no-deps community\`.

          See docs/staging-artifact-release.md.
          EOF

      - name: Create pre-release (never overwrite an existing artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="community-stage-${RELEASE_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Repeated manual clicks must not show a false failure. Never
            # overwrite published assets; verify the existing release is whole.
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if grep -Fxq "h00k-community-image.tar.gz" <<< "$ASSETS" &&
               grep -Fxq "h00k-community-image.tar.gz.sha256" <<< "$ASSETS"; then
              echo "::notice::Release $TAG already exists with both assets; keeping it unchanged"
              exit 0
            fi
            echo "::error::Existing release $TAG has missing assets; refusing to overwrite it"
            exit 1
          fi
          cd "$RUNNER_TEMP/community-release"
          gh release create "$TAG" \
            h00k-community-image.tar.gz \
            h00k-community-image.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Community staging ${RELEASE_SHA}" \
            --prerelease \
            --notes-file release-notes.md
